<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loop — Trial Reset Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0d0716;
    --bg-elevated: #150c24;
    --panel: #1b1130;
    --card: #211435;
    --card-hover: #29193f;
    --border: #33204d;
    --border-soft: #2a1a40;
    --text: #efe9fb;
    --text-dim: #a898c4;
    --text-faint: #6f5c8c;
    --accent: #a855f7;
    --accent-2: #7c3aed;
    --accent-glow: #c084fc;
    --ready: #4ade80;
    --ready-glow: #86efac;
    --danger: #f87171;
    --radius-lg: 20px;
    --radius-md: 14px;
    --radius-sm: 9px;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1100px 600px at 12% -10%, rgba(168,85,247,0.16), transparent 60%),
      radial-gradient(900px 700px at 100% 10%, rgba(124,58,237,0.14), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }

  h1,h2,h3, .brand, .list-name, .form-title{
    font-family:'Sora', sans-serif;
  }

  button{ font-family:'Inter', sans-serif; cursor:pointer; }
  input{ font-family:'Inter', sans-serif; }

  ::selection{ background:var(--accent-2); color:white; }

  /* ---------- Auth screen ---------- */
  #authScreen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .auth-card{
    width:100%;
    max-width:400px;
    background:linear-gradient(180deg, var(--panel), var(--bg-elevated));
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    padding:40px 36px 34px;
    box-shadow:0 30px 80px -20px rgba(124,58,237,0.35);
  }
  .auth-mark{
    width:44px; height:44px;
    border-radius:50%;
    background:conic-gradient(from 180deg, var(--accent-2), var(--accent), var(--accent-glow), var(--accent-2));
    margin-bottom:22px;
    position:relative;
  }
  .auth-mark::after{
    content:"";
    position:absolute; inset:6px;
    border-radius:50%;
    background:var(--panel);
  }
  .auth-card h1{
    font-size:26px;
    font-weight:700;
    margin:0 0 6px;
    letter-spacing:-0.02em;
  }
  .auth-card p{
    color:var(--text-dim);
    font-size:14.5px;
    line-height:1.55;
    margin:0 0 26px;
  }
  .field-label{
    display:block;
    font-size:12.5px;
    color:var(--text-dim);
    margin-bottom:7px;
  }
  .auth-card input[type="text"]{
    width:100%;
    background:var(--card);
    border:1px solid var(--border);
    color:var(--text);
    padding:12px 14px;
    border-radius:var(--radius-sm);
    font-size:15px;
    outline:none;
    transition:border-color .15s ease;
  }
  .auth-card input[type="text"]:focus{
    border-color:var(--accent);
  }
  .btn-primary{
    width:100%;
    margin-top:18px;
    background:linear-gradient(135deg, var(--accent-2), var(--accent));
    color:white;
    border:none;
    padding:12.5px 14px;
    border-radius:var(--radius-sm);
    font-size:15px;
    font-weight:600;
    transition:filter .15s ease, transform .1s ease;
  }
  .btn-primary:hover{ filter:brightness(1.12); }
  .btn-primary:active{ transform:scale(0.98); }
  .auth-hint{
    margin-top:16px;
    font-size:12.5px;
    color:var(--text-faint);
    text-align:center;
  }

  /* ---------- App shell ---------- */
  #app{ display:flex; min-height:100vh; }

  .sidebar{
    width:270px;
    flex-shrink:0;
    background:var(--bg-elevated);
    border-right:1px solid var(--border-soft);
    display:flex;
    flex-direction:column;
    padding:22px 18px;
  }
  .brand-row{
    display:flex; align-items:center; gap:10px;
    padding:2px 4px 20px;
  }
  .brand-mark{
    width:26px;height:26px;border-radius:50%;
    background:conic-gradient(from 180deg, var(--accent-2), var(--accent), var(--accent-glow), var(--accent-2));
    position:relative; flex-shrink:0;
  }
  .brand-mark::after{
    content:""; position:absolute; inset:4px; border-radius:50%; background:var(--bg-elevated);
  }
  .brand{ font-size:17px; font-weight:700; letter-spacing:-0.01em; }

  .account-box{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--panel);
    border:1px solid var(--border-soft);
    border-radius:var(--radius-md);
    padding:11px 13px;
    margin-bottom:20px;
  }
  .account-name{ font-size:13.5px; color:var(--text-dim); }
  .account-name b{ color:var(--text); font-weight:600; }
  .logout-btn{
    background:none; border:none; color:var(--text-faint);
    font-size:12.5px; padding:4px 6px; border-radius:6px;
  }
  .logout-btn:hover{ color:var(--text); background:var(--card); }

  .sidebar-label{
    font-size:11.5px;
    color:var(--text-faint);
    margin:4px 4px 10px;
    text-transform:none;
  }

  .list-nav{
    display:flex; flex-direction:column; gap:4px;
    overflow-y:auto;
    flex:1;
  }
  .list-nav-item{
    display:flex; align-items:center; justify-content:space-between;
    gap:8px;
    padding:10px 12px;
    border-radius:var(--radius-sm);
    cursor:pointer;
    border:1px solid transparent;
    transition:background .12s ease;
  }
  .list-nav-item:hover{ background:var(--panel); }
  .list-nav-item.active{
    background:var(--card);
    border-color:var(--border);
  }
  .list-nav-left{ display:flex; align-items:center; gap:10px; min-width:0; }
  .list-dot{
    width:7px; height:7px; border-radius:50%;
    background:var(--accent);
    flex-shrink:0;
  }
  .list-nav-item.active .list-dot{ background:var(--accent-glow); box-shadow:0 0 8px var(--accent-glow); }
  .list-nav-name{
    font-size:14px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .list-count{
    font-size:11.5px; color:var(--text-faint);
    background:var(--bg-elevated);
    padding:2px 7px; border-radius:20px;
    flex-shrink:0;
  }
  .list-del{
    background:none; border:none; color:var(--text-faint);
    font-size:15px; line-height:1; padding:2px 4px; border-radius:5px;
    opacity:0; flex-shrink:0;
  }
  .list-nav-item:hover .list-del{ opacity:1; }
  .list-del:hover{ color:var(--danger); }

  .add-list-form{
    margin-top:14px;
    display:flex; gap:6px;
  }
  .add-list-form input{
    flex:1; min-width:0;
    background:var(--panel);
    border:1px solid var(--border-soft);
    color:var(--text);
    padding:9px 11px;
    border-radius:var(--radius-sm);
    font-size:13px;
    outline:none;
  }
  .add-list-form input:focus{ border-color:var(--accent); }
  .add-list-form button{
    background:var(--card);
    border:1px solid var(--border);
    color:var(--text);
    width:36px; border-radius:var(--radius-sm);
    font-size:16px;
  }
  .add-list-form button:hover{ background:var(--card-hover); }

  /* ---------- Main panel ---------- */
  .main{
    flex:1;
    padding:38px 44px;
    overflow-y:auto;
  }
  .main-header{
    display:flex; align-items:flex-end; justify-content:space-between;
    margin-bottom:28px;
    gap:20px;
    flex-wrap:wrap;
  }
  .main-header h2{
    font-size:26px;
    font-weight:700;
    letter-spacing:-0.02em;
    margin:0 0 6px;
  }
  .main-header .sub{
    color:var(--text-dim);
    font-size:14px;
    margin:0;
  }

  .add-email-form{
    display:flex; gap:10px; flex-wrap:wrap;
    align-items:flex-end;
    background:var(--panel);
    border:1px solid var(--border-soft);
    border-radius:var(--radius-md);
    padding:16px;
    margin-bottom:26px;
  }
  .add-email-form .field{ display:flex; flex-direction:column; gap:6px; }
  .add-email-form label{ font-size:11.5px; color:var(--text-faint); }
  .add-email-form input{
    background:var(--card);
    border:1px solid var(--border);
    color:var(--text);
    padding:10px 12px;
    border-radius:var(--radius-sm);
    font-size:14px;
    outline:none;
  }
  .add-email-form input:focus{ border-color:var(--accent); }
  #newEmailInput{ width:260px; }
  #newHoursInput{ width:90px; }
  .add-email-form .btn-add{
    background:linear-gradient(135deg, var(--accent-2), var(--accent));
    border:none; color:white; font-weight:600;
    padding:10.5px 18px;
    border-radius:var(--radius-sm);
    font-size:14px;
  }
  .add-email-form .btn-add:hover{ filter:brightness(1.1); }

  .empty-state{
    border:1px dashed var(--border);
    border-radius:var(--radius-lg);
    padding:60px 30px;
    text-align:center;
    color:var(--text-faint);
    font-size:14px;
  }

  .email-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(250px, 1fr));
    gap:16px;
  }

  .email-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    padding:20px 18px 18px;
    display:flex; flex-direction:column; align-items:center;
    text-align:center;
    position:relative;
    transition:border-color .15s ease;
  }
  .email-card:hover{ border-color:var(--border);}
  .email-card.is-ready{ border-color:rgba(74,222,128,0.35); }

  .email-card .remove-btn{
    position:absolute; top:10px; right:10px;
    background:none; border:none; color:var(--text-faint);
    font-size:15px; padding:3px 6px; border-radius:6px; line-height:1;
  }
  .email-card .remove-btn:hover{ color:var(--danger); }

  .ring{
    width:118px; height:118px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    margin-bottom:14px;
    position:relative;
  }
  .ring-inner{
    width:96px; height:96px;
    border-radius:50%;
    background:var(--card);
    display:flex; align-items:center; justify-content:center;
    flex-direction:column;
  }
  .ring-time{
    font-family:'JetBrains Mono', monospace;
    font-size:15px;
    font-weight:700;
    letter-spacing:0.01em;
    font-variant-numeric:tabular-nums;
  }
  .ring-time.ready{ color:var(--ready); font-size:12px; font-weight:600; line-height:1.3; padding:0 8px; }
  .ring-unit{
    font-size:10px;
    color:var(--text-faint);
    margin-top:3px;
    letter-spacing:0.03em;
  }

  .email-addr{
    font-size:14px;
    font-weight:600;
    word-break:break-word;
    margin-bottom:4px;
  }
  .email-duration{
    font-size:12px;
    color:var(--text-faint);
    margin-bottom:14px;
  }

  .reset-btn{
    width:100%;
    padding:9px 12px;
    border-radius:var(--radius-sm);
    font-size:13px;
    font-weight:600;
    border:1px solid var(--border);
    background:var(--panel);
    color:var(--text-dim);
  }
  .reset-btn.ready{
    background:linear-gradient(135deg, #22c55e, #4ade80);
    border:none;
    color:#0a1a0f;
  }
  .reset-btn.ready:hover{ filter:brightness(1.08); }
  .reset-btn:not(.ready):hover{ background:var(--card-hover); }

  @media (max-width: 760px){
    #app{ flex-direction:column; }
    .sidebar{ width:100%; border-right:none; border-bottom:1px solid var(--border-soft); }
    .main{ padding:26px 20px; }
    #newEmailInput{ width:100%; }
  }

  [hidden]{ display:none !important; }

  :focus-visible{
    outline:2px solid var(--accent-glow);
    outline-offset:2px;
  }
</style>
</head>
<body>

<!-- ================= AUTH SCREEN ================= -->
<div id="authScreen">
  <div class="auth-card">
    <div class="auth-mark"></div>
    <h1>Loop</h1>
    <p>Keep every free-trial reset on schedule. Sign in with a name to get your own lists.</p>
    <span class="field-label">Your name</span>
    <input type="text" id="authNameInput" placeholder="e.g. Rafi" autocomplete="off">
    <button class="btn-primary" id="authSubmitBtn">Continue</button>
    <div class="auth-hint">New name? We'll set up a fresh account automatically.</div>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="app" hidden>
  <aside class="sidebar">
    <div class="brand-row">
      <div class="brand-mark"></div>
      <div class="brand">Loop</div>
    </div>

    <div class="account-box">
      <div class="account-name">Signed in as <b id="currentUserLabel"></b></div>
      <button class="logout-btn" id="logoutBtn">Switch</button>
    </div>

    <div class="sidebar-label">Your lists</div>
    <div class="list-nav" id="listNav"></div>

    <form class="add-list-form" id="addListForm">
      <input type="text" id="newListInput" placeholder="e.g. Claude, ChatGPT" autocomplete="off">
      <button type="submit" title="Add list">+</button>
    </form>
  </aside>

  <main class="main">
    <div class="main-header">
      <div>
        <h2 id="listTitle">—</h2>
        <p class="sub" id="listSub"></p>
      </div>
    </div>

    <form class="add-email-form" id="addEmailForm" hidden>
      <div class="field">
        <label for="newEmailInput">Email address</label>
        <input type="text" id="newEmailInput" placeholder="name@example.com" autocomplete="off">
      </div>
      <div class="field">
        <label for="newHoursInput">Reset every (hrs)</label>
        <input type="number" id="newHoursInput" value="24" min="0.1" step="0.5">
      </div>
      <button type="submit" class="btn-add">Add email</button>
    </form>

    <div id="mainBody"></div>
  </main>
</div>

<script>
(function(){
  "use strict";

  var STORAGE_KEY = "loop_trial_tracker_v1";

  /* ---------- data layer (JSON encoded) ---------- */
  function loadData(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return { users:{}, currentUser:null };
      var parsed = JSON.parse(raw);
      if(!parsed.users) parsed.users = {};
      return parsed;
    }catch(e){
      return { users:{}, currentUser:null };
    }
  }
  function saveData(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  var state = loadData();
  var activeListId = null;

  function uid(){
    return Date.now().toString(36) + Math.random().toString(36).slice(2,8);
  }

  function currentUserData(){
    if(!state.currentUser) return null;
    return state.users[state.currentUser];
  }

  /* ---------- auth ---------- */
  var authScreen = document.getElementById("authScreen");
  var appEl = document.getElementById("app");
  var authNameInput = document.getElementById("authNameInput");
  var authSubmitBtn = document.getElementById("authSubmitBtn");
  var currentUserLabel = document.getElementById("currentUserLabel");
  var logoutBtn = document.getElementById("logoutBtn");

  function doLogin(name){
    name = name.trim();
    if(!name) return;
    if(!state.users[name]){
      state.users[name] = { lists: [] };
    }
    state.currentUser = name;
    saveData();
    activeListId = (state.users[name].lists[0] && state.users[name].lists[0].id) || null;
    renderAll();
  }

  authSubmitBtn.addEventListener("click", function(){ doLogin(authNameInput.value); });
  authNameInput.addEventListener("keydown", function(e){
    if(e.key === "Enter") doLogin(authNameInput.value);
  });

  logoutBtn.addEventListener("click", function(){
    state.currentUser = null;
    saveData();
    activeListId = null;
    authNameInput.value = "";
    renderAll();
  });

  /* ---------- lists ---------- */
  var listNav = document.getElementById("listNav");
  var addListForm = document.getElementById("addListForm");
  var newListInput = document.getElementById("newListInput");

  addListForm.addEventListener("submit", function(e){
    e.preventDefault();
    var name = newListInput.value.trim();
    if(!name) return;
    var user = currentUserData();
    var list = { id: uid(), name: name, emails: [] };
    user.lists.push(list);
    activeListId = list.id;
    newListInput.value = "";
    saveData();
    renderAll();
  });

  function selectList(id){
    activeListId = id;
    renderAll();
  }

  function deleteList(id, ev){
    ev.stopPropagation();
    var user = currentUserData();
    user.lists = user.lists.filter(function(l){ return l.id !== id; });
    if(activeListId === id){
      activeListId = user.lists.length ? user.lists[0].id : null;
    }
    saveData();
    renderAll();
  }

  /* ---------- emails ---------- */
  var addEmailForm = document.getElementById("addEmailForm");
  var newEmailInput = document.getElementById("newEmailInput");
  var newHoursInput = document.getElementById("newHoursInput");

  addEmailForm.addEventListener("submit", function(e){
    e.preventDefault();
    var email = newEmailInput.value.trim();
    var hours = parseFloat(newHoursInput.value);
    if(!email) return;
    if(!hours || hours <= 0) hours = 24;
    var list = getActiveList();
    if(!list) return;
    list.emails.push({
      id: uid(),
      email: email,
      durationHours: hours,
      startTime: Date.now()
    });
    newEmailInput.value = "";
    newHoursInput.value = "24";
    saveData();
    renderAll();
  });

  function removeEmail(listId, emailId){
    var user = currentUserData();
    var list = user.lists.find(function(l){ return l.id === listId; });
    if(!list) return;
    list.emails = list.emails.filter(function(en){ return en.id !== emailId; });
    saveData();
    renderAll();
  }

  function resetEmail(listId, emailId){
    var user = currentUserData();
    var list = user.lists.find(function(l){ return l.id === listId; });
    if(!list) return;
    var entry = list.emails.find(function(en){ return en.id === emailId; });
    if(!entry) return;
    entry.startTime = Date.now();
    saveData();
    renderTick(); // instant visual update without full re-render
  }

  function getActiveList(){
    var user = currentUserData();
    if(!user) return null;
    return user.lists.find(function(l){ return l.id === activeListId; }) || null;
  }

  /* ---------- rendering ---------- */
  var listTitle = document.getElementById("listTitle");
  var listSub = document.getElementById("listSub");
  var mainBody = document.getElementById("mainBody");

  function renderAll(){
    var loggedIn = !!state.currentUser;
    authScreen.hidden = loggedIn;
    appEl.hidden = !loggedIn;
    if(!loggedIn) return;

    currentUserLabel.textContent = state.currentUser;

    var user = currentUserData();

    // sidebar list nav
    listNav.innerHTML = "";
    user.lists.forEach(function(list){
      var item = document.createElement("div");
      item.className = "list-nav-item" + (list.id === activeListId ? " active" : "");
      item.addEventListener("click", function(){ selectList(list.id); });

      var left = document.createElement("div");
      left.className = "list-nav-left";
      left.innerHTML = '<span class="list-dot"></span><span class="list-nav-name">'+escapeHtml(list.name)+'</span>';

      var right = document.createElement("div");
      right.style.display = "flex";
      right.style.alignItems = "center";
      right.style.gap = "4px";

      var count = document.createElement("span");
      count.className = "list-count";
      count.textContent = list.emails.length;

      var del = document.createElement("button");
      del.className = "list-del";
      del.type = "button";
      del.title = "Delete list";
      del.textContent = "×";
      del.addEventListener("click", function(ev){ deleteList(list.id, ev); });

      right.appendChild(count);
      right.appendChild(del);
      item.appendChild(left);
      item.appendChild(right);
      listNav.appendChild(item);
    });

    // main panel
    var list = getActiveList();
    if(!list){
      listTitle.textContent = user.lists.length ? "Select a list" : "No lists yet";
      listSub.textContent = user.lists.length ? "Pick a list from the sidebar." : "Add your first list on the left — try \u201cClaude\u201d or \u201cChatGPT\u201d.";
      addEmailForm.hidden = true;
      mainBody.innerHTML = '<div class="empty-state">Nothing selected. Create a list to start tracking reset timers.</div>';
      return;
    }

    listTitle.textContent = list.name;
    listSub.textContent = list.emails.length + (list.emails.length === 1 ? " email tracked" : " emails tracked");
    addEmailForm.hidden = false;

    if(list.emails.length === 0){
      mainBody.innerHTML = '<div class="empty-state">No emails yet. Add one above to start its clock.</div>';
      return;
    }

    var grid = document.createElement("div");
    grid.className = "email-grid";

    list.emails.forEach(function(entry){
      grid.appendChild(buildEmailCard(list.id, entry));
    });

    mainBody.innerHTML = "";
    mainBody.appendChild(grid);
  }

  function buildEmailCard(listId, entry){
    var card = document.createElement("div");
    card.className = "email-card";
    card.dataset.listId = listId;
    card.dataset.emailId = entry.id;

    var removeBtn = document.createElement("button");
    removeBtn.className = "remove-btn";
    removeBtn.type = "button";
    removeBtn.title = "Remove email";
    removeBtn.textContent = "×";
    removeBtn.addEventListener("click", function(){ removeEmail(listId, entry.id); });
    card.appendChild(removeBtn);

    var ring = document.createElement("div");
    ring.className = "ring";
    ring.innerHTML = '<div class="ring-inner"><div class="ring-time"></div><div class="ring-unit"></div></div>';
    card.appendChild(ring);

    var addr = document.createElement("div");
    addr.className = "email-addr";
    addr.textContent = entry.email;
    card.appendChild(addr);

    var dur = document.createElement("div");
    dur.className = "email-duration";
    dur.textContent = "Resets every " + formatHours(entry.durationHours);
    card.appendChild(dur);

    var resetBtn = document.createElement("button");
    resetBtn.type = "button";
    resetBtn.className = "reset-btn";
    resetBtn.textContent = "Limit End";
    resetBtn.addEventListener("click", function(){ resetEmail(listId, entry.id); });
    card.appendChild(resetBtn);

    return card;
  }

  function formatHours(h){
    if(h === 24) return "24 hours";
    if(h < 1) return Math.round(h*60) + " min";
    if(h % 1 === 0) return h + " hours";
    return h + " hours";
  }

  function escapeHtml(str){
    var div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  /* ---------- live countdown tick ---------- */
  function renderTick(){
    var user = currentUserData();
    if(!user) return;
    var list = getActiveList();
    if(!list) return;

    list.emails.forEach(function(entry){
      var card = mainBody.querySelector('.email-card[data-email-id="'+entry.id+'"]');
      if(!card) return;

      var endTime = entry.startTime + entry.durationHours * 3600000;
      var remaining = endTime - Date.now();

      var ringEl = card.querySelector(".ring");
      var timeEl = card.querySelector(".ring-time");
      var unitEl = card.querySelector(".ring-unit");
      var resetBtn = card.querySelector(".reset-btn");

      if(remaining <= 0){
        card.classList.add("is-ready");
        ringEl.style.background = "conic-gradient(" + "var(--ready) 100%, var(--border) 0%)";
        timeEl.classList.add("ready");
        timeEl.textContent = "Free mode available";
        unitEl.textContent = "";
        resetBtn.classList.add("ready");
      } else {
        card.classList.remove("is-ready");
        var totalMs = entry.durationHours * 3600000;
        var pct = Math.max(0, Math.min(100, (1 - remaining/totalMs) * 100));
        ringEl.style.background = "conic-gradient(var(--accent) " + pct + "%, var(--border-soft) " + pct + "%)";
        timeEl.classList.remove("ready");

        var totalSec = Math.floor(remaining/1000);
        var days = Math.floor(totalSec / 86400);
        var hrs = Math.floor((totalSec % 86400) / 3600);
        var mins = Math.floor((totalSec % 3600) / 60);
        var secs = totalSec % 60;

        if(days > 0){
          timeEl.textContent = pad(days)+":"+pad(hrs)+":"+pad(mins);
          unitEl.textContent = "days:hrs:min";
        } else {
          timeEl.textContent = pad(hrs)+":"+pad(mins)+":"+pad(secs);
          unitEl.textContent = "hrs : min : sec";
        }
        resetBtn.classList.remove("ready");
      }
    });
  }

  function pad(n){ return n.toString().padStart(2,"0"); }

  renderAll();
  renderTick();
  setInterval(renderTick, 1000);

})();
</script>
</body>
</html>
